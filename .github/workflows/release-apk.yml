name: Build & Publish CivilSpec Android APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release tag (e.g. v1.0.0) if publishing a GitHub Release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare debug signing keystore & env
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          touch .env

      - name: Run Java and Kotlin engineering unit tests
        run: gradle :app:testDebugUnitTest --tests "com.example.JavaKernelTest" --tests "com.example.CivilSpecCalcEngineTest" --tests "com.example.ExampleUnitTest"

      - name: Assemble Android APK
        run: gradle :app:assembleDebug

      - name: Prepare APK artifact filename
        id: apk
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          fi
          OUT_NAME="CivilSpec-${TAG}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT_NAME"
          echo "file=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CivilSpec-Android-APK
          path: ${{ steps.apk.outputs.file }}

      - name: Publish GitHub Release on tag push
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.apk.outputs.tag }}" "${{ steps.apk.outputs.file }}" \
            --title "CivilSpec ${{ steps.apk.outputs.tag }}" \
            --notes "Android APK build for CivilSpec (decision-support civil engineering calculation workspace). See README for installation and PE/SE engineering review notice." \
            --latest
